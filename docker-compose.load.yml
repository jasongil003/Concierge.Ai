services:
  mock-ai:
    build:
      context: ./loadtest
      dockerfile: mock-ai.Dockerfile
    restart: unless-stopped
    environment:
      MOCK_AI_MODE: ${MOCK_AI_MODE:-normal}
      MOCK_AI_DELAY_SECONDS: ${MOCK_AI_DELAY_SECONDS:-8}
    expose:
      - "8081"
    networks:
      - loadtest

  concierge:
    environment:
      ENABLE_BACKGROUND_WORKERS: "false"
      AI_PROVIDER_MODE: compatible
      COMPATIBLE_API_BASE_URL: http://mock-ai:8081
      COMPATIBLE_FAST_MODEL: concierge-loadtest
      COMPATIBLE_ADVANCED_MODEL: concierge-loadtest
    networks:
      - frontend
      - loadtest
    extra_hosts: !reset []

  proxy:
    ports: !override
      - "${LOADTEST_BIND_ADDRESS:-127.0.0.1}:${LOADTEST_PORT:-18080}:80"

networks:
  frontend:
    internal: true
  loadtest:
    internal: true
