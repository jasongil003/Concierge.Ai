<!DOCTYPE html>

    <style>
      @font-face {
        font-family: "Concierge Serif";
        src: local("Iowan Old Style"), local("Georgia");
        font-weight: 400 700;
      }
      @font-face {
        font-family: "Concierge Sans";
        src: local("Geist"), local("Inter"), local("Arial");
        font-weight: 400 700;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FAF8F4;
        font-family: "Concierge Sans", Arial, sans-serif;
      }
      .composition-layer {
        position: absolute;
        inset: 0;
        opacity: 0;
      }
      .clip {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
