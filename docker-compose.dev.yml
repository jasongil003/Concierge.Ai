services:
  concierge:
    build:
      context: .
      args:
        CONCIERGE_VERSION: ${CONCIERGE_VERSION:-local}
        CONCIERGE_COMMIT: ${CONCIERGE_COMMIT:-unknown}
        CONCIERGE_BUILD_DATE: ${CONCIERGE_BUILD_DATE:-unknown}
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: development
      CONCIERGE_DEPLOYMENT_MODE: docker-dev
      ADMIN_COOKIE_SECURE: "false"
      ALLOW_BODY_PROPERTY_SELECTION: "true"
      ALLOW_DEMO_SETTINGS: "true"
      DATABASE_URL: ""
      REDIS_URL: ""
      DB_PATH: /state/concierge.db
      UPLOAD_ROOT: /state/uploads
    volumes:
      - concierge-dev-state:/state
    ports:
      # Development profile is for same-machine use only; it has no TLS layer.
      - "${CONCIERGE_DEV_BIND_HOST:-127.0.0.1}:${CONCIERGE_DEV_PORT:-8081}:8080"
    restart: unless-stopped

volumes:
  concierge-dev-state:
