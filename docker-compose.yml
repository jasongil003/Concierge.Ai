services:
  concierge:
    image: concierge-ai:${CONCIERGE_VERSION:-local}
    build:
      context: .
      args:
        CONCIERGE_VERSION: ${CONCIERGE_VERSION:-local}
        CONCIERGE_COMMIT: ${CONCIERGE_COMMIT:-unknown}
        CONCIERGE_BUILD_DATE: ${CONCIERGE_BUILD_DATE:-unknown}
    init: true
    stop_grace_period: 45s
    env_file:
      - ${CONCIERGE_CONFIG_FILE:-.env}
    environment:
      APP_ENVIRONMENT: production
      CONCIERGE_DEPLOYMENT_MODE: appliance
      DB_PATH: /state/concierge.db
      UPLOAD_ROOT: /state/uploads
      CONCIERGE_BACKUP_DIR: /backups
      # The on-prem MVP uses one persistent SQLite database in this volume.
      DATABASE_URL: ""
      # SQLite-backed rate limiting is sufficient for this single-instance profile.
      REDIS_URL: ""
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-root}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-admin}
      CREDENTIAL_ENCRYPTION_SECRET: ${CREDENTIAL_ENCRYPTION_SECRET:?Set a unique CREDENTIAL_ENCRYPTION_SECRET in .env}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set a random METRICS_TOKEN in .env}
      CANONICAL_HOSTS: ${CANONICAL_HOSTS:?Set comma-separated public hostnames in .env}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Set the public HTTPS origin in .env}
      ADMIN_ALLOWED_CIDRS: ${ADMIN_ALLOWED_CIDRS:?Restrict admin access to trusted networks in .env}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-172.29.0.2}
      ADMIN_COOKIE_SECURE: "true"
      ALLOW_BODY_PROPERTY_SELECTION: "false"
      ALLOW_DEMO_SETTINGS: "false"
      APP_DEBUG: "false"
      ENABLE_BACKGROUND_WORKERS: "true"
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1", "--no-proxy-headers"]
    expose:
      - "8080"
    volumes:
      - concierge-state:/state
      - ${CONCIERGE_BACKUP_DIR:-./.backups}:/backups
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - frontend

  proxy:
    image: nginx:1.29-alpine
    ports:
      # Loopback only: terminate HTTPS in a trusted host reverse proxy before this listener.
      - "127.0.0.1:8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - concierge
    networks:
      frontend:
        ipv4_address: 172.29.0.2

volumes:
  concierge-state:

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.29.0.0/24
