services:
  concierge:
    build: .
    container_name: concierge-ai
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_PATH: /state/concierge.db
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - concierge-state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  concierge-state:
