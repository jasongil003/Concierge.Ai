services:
  concierge:
    build: .
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: production
      DB_PATH: /state/concierge.db
      UPLOAD_ROOT: /state/uploads
      # The on-prem MVP uses one persistent SQLite database in this volume.
      DATABASE_URL: ""
      # SQLite-backed rate limiting is sufficient for this single-instance profile.
      REDIS_URL: ""
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:?Set a unique strong ADMIN_BOOTSTRAP_PASSWORD in .env}
      CREDENTIAL_ENCRYPTION_SECRET: ${CREDENTIAL_ENCRYPTION_SECRET:?Set a unique CREDENTIAL_ENCRYPTION_SECRET in .env}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set a random METRICS_TOKEN in .env}
      ADMIN_COOKIE_SECURE: "true"
      ALLOW_BODY_PROPERTY_SELECTION: "false"
      ALLOW_DEMO_SETTINGS: "false"
      APP_DEBUG: "false"
      ENABLE_BACKGROUND_WORKERS: "true"
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1", "--proxy-headers", "--forwarded-allow-ips=172.29.0.2"]
    expose:
      - "8080"
    volumes:
      - concierge-state:/state
    networks:
      - frontend

  proxy:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - concierge
    networks:
      frontend:
        ipv4_address: 172.29.0.2

volumes:
  concierge-state:

networks:
  frontend:
    ipam:
      config:
        - subnet: 172.29.0.0/24
