services:
  concierge:
    build: .
    container_name: concierge-ai
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_ENVIRONMENT: production
      ADMIN_COOKIE_SECURE: "true"
      ALLOW_BODY_PROPERTY_SELECTION: "false"
      APP_DEBUG: "false"
      DB_PATH: /state/concierge.db
      UPLOAD_ROOT: /state/uploads
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      - concierge-state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  concierge-state:
