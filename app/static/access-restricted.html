<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Access Restricted · Concierge.AI</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100dvh; margin: 0; place-items: center; padding: 24px; color: #171717; background: #f5f5f3; }
    main { width: min(100%, 460px); padding: 32px; border: 1px solid #d8d8d4; border-radius: 12px; background: #fff; box-shadow: 0 20px 60px rgba(0,0,0,.08); }
    .mark { display: grid; width: 38px; height: 38px; margin-bottom: 28px; place-items: center; border-radius: 9px; color: #fff; background: #171717; font-weight: 700; }
    h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: -.02em; }
    p { margin: 0 0 12px; color: #555; line-height: 1.6; }
    p:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <main role="main" aria-labelledby="restricted-title">
    <div class="mark" aria-hidden="true">C</div>
    <h1 id="restricted-title">Access Restricted</h1>
    <p>Concierge.AI is available only while connected to the hotel guest Wi-Fi network.</p>
    <p>Please connect to the hotel Wi-Fi and try again.</p>
  </main>
</body>
</html>
