<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Concierge.Ai</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="concierge-shell" id="concierge-shell">
    <header class="concierge-header">
      <button class="icon-button" id="menu-button" type="button" aria-label="Open hotel menu">
        <span></span><span></span>
      </button>
      <div class="hotel-identity" aria-live="polite">
        <div class="hotel-mark" id="hotel-mark">C</div>
        <div>
          <strong id="hotel-name">Concierge</strong>
          <span id="concierge-name">AI concierge</span>
        </div>
      </div>
      <button class="icon-button dots-button" id="options-button" type="button" aria-label="Open options">
        <span></span><span></span><span></span>
      </button>
    </header>

    <section class="conversation-region" aria-label="Concierge conversation">
      <div class="conversation-column">
        <section class="welcome-state" id="welcome-state">
          <p id="welcome-greeting">Good evening.</p>
          <h1 id="welcome-headline">How can I help with your stay?</h1>
          <div class="suggestion-list" id="suggestion-list" aria-label="Suggested prompts"></div>
        </section>

        <section class="message-list" id="message-list" aria-live="polite" aria-label="Messages"></section>
      </div>
    </section>

    <footer class="composer-region">
      <form class="composer" id="composer-form">
        <button class="composer-tool" id="plus-button" type="button" aria-label="More actions">+</button>
        <textarea
          id="composer-input"
          rows="1"
          maxlength="2000"
          autocomplete="off"
          placeholder="Ask your concierge..."
          aria-label="Ask your concierge"
        ></textarea>
        <button class="send-button" id="send-button" type="submit" aria-label="Send message" disabled>↑</button>
      </form>
      <p class="composer-note" id="composer-note">Concierge can help with hotel information, Wi-Fi, dining, checkout, and requests.</p>
    </footer>

    <aside class="hotel-menu" id="hotel-menu" aria-hidden="true" aria-label="Hotel menu">
      <div class="menu-panel">
        <div class="menu-header">
          <strong>Hotel menu</strong>
          <button class="icon-button" id="close-menu-button" type="button" aria-label="Close menu">×</button>
        </div>
        <button type="button" data-menu-action="new-chat">New conversation</button>
        <button type="button" data-menu-action="hotel-info">Hotel information</button>
        <button type="button" data-menu-action="language">Language</button>
        <button type="button" data-menu-action="accessibility">Accessibility</button>
        <button type="button" data-menu-action="privacy">Privacy</button>
        <button type="button" data-menu-action="help">Help</button>
      </div>
    </aside>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
