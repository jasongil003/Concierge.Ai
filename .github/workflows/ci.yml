name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: concierge-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Compile application
        run: python -m compileall -q app

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  python-dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned Python dependency auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit Python dependencies
        run: python -m pip_audit -r requirements-dev.txt

  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies and Bandit
        run: pip install -r requirements-dev.txt
      - name: Run Python security analysis
        run: bandit -q -r app -x app/static --severity-level medium --confidence-level medium

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  browser-tests:
    # PR gate: run functional browser coverage on the readily available Linux runner.
    # Platform-dependent visual snapshots run in macos-native-validation.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run functional browser tests
        env:
          PLAYWRIGHT_SERVER_COMMAND: python -m uvicorn app.main:app --host 127.0.0.1 --port 8092 --no-proxy-headers
          PROPERTY_ID: ci-property
        run: npx playwright test --grep-invert @visual

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  postgres-redis-integration:
    # Keep the runner's PostgreSQL client aligned with the PostgreSQL 16 service.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql+psycopg://concierge@127.0.0.1:5432/concierge
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_TEST_URL: redis://127.0.0.1:6379/2
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: concierge
          POSTGRES_DB: concierge
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U concierge -d concierge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies and PostgreSQL client
        run: |
          pip install -r requirements-dev.txt
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/16/bin:$PATH"
          pg_dump --version
          pg_restore --version
          pg_dump --version | grep -qE '^pg_dump \(PostgreSQL\) 16\.'
          pg_restore --version | grep -qE '^pg_restore \(PostgreSQL\) 16\.'
      - name: Generate integration-only application credentials
        run: |
          echo "ADMIN_BOOTSTRAP_PASSWORD=$(openssl rand -hex 16)A!" >> "$GITHUB_ENV"
          echo "CREDENTIAL_ENCRYPTION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Apply fresh schema and confirm repeatable migration
        run: |
          alembic upgrade head
          alembic upgrade head
      - name: Migrate an existing SQLite installation
        run: pytest -q tests/test_postgres_sqlite_migration.py
      - name: PostgreSQL adapter, transaction, query-plan, backup restore, and Redis integration tests
        env:
          PG_DUMP_AVAILABLE: "1"
        run: >-
          pytest -q
          tests/test_postgres_integration.py
          tests/test_postgres_backup_integration.py
          tests/test_redis_rate_limiter.py
          tests/test_ai_provider_distributed_bulkhead.py
      - name: Start deterministic AI and API for the load smoke
        run: |
          export APP_ENVIRONMENT=development
          export PROPERTY_ID=ci-property
          export DB_PATH=/tmp/concierge-load-smoke.sqlite
          export UPLOAD_ROOT=/tmp/concierge-load-smoke-uploads
          ADMIN_BOOTSTRAP_PASSWORD="$(openssl rand -hex 16)A!"
          CREDENTIAL_ENCRYPTION_SECRET="$(openssl rand -hex 32)"
          export ADMIN_BOOTSTRAP_PASSWORD CREDENTIAL_ENCRYPTION_SECRET
          export ADMIN_COOKIE_SECURE=false
          export ALLOW_BODY_PROPERTY_SELECTION=true
          export ALLOW_DEMO_SETTINGS=true
          export ANTLABS_MODE=mock
          export ENABLE_BACKGROUND_WORKERS=false
          METRICS_TOKEN="$(openssl rand -hex 24)"
          export METRICS_TOKEN
          export REDIS_URL=redis://127.0.0.1:6379/0
          export LOCAL_AI_ALLOWED_ENDPOINTS=http://127.0.0.1:8081
          export LOADTEST_STAFF_CONVERSATION_FLOW=true
          python -c 'from app.config import settings; from app.properties import PropertyRecord, PropertyStore; from app.hospitality import HospitalityStore; PropertyStore(settings.db_path).upsert(PropertyRecord(property_id="ci-property", hotel_name="CI Load Smoke")); h=HospitalityStore(settings.db_path); h.create_restaurant("ci-property", {"name":"CI Load Smoke Dining"}) if not h.guest_facilities("ci-property")["restaurants"] else None'
          python loadtest/mock_ai.py > /tmp/concierge-mock-ai.log 2>&1 &
          mock_pid=$!
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8092 > /tmp/concierge-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" "$mock_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8092/health/ready >/dev/null && curl --silent --fail http://127.0.0.1:8081/health >/dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:8092/health/ready
          LOADTEST_CONFIRMATION=YES MOCK_AI_URL=http://127.0.0.1:8081 python scripts/configure_loadtest_ai.py
          locust --headless -f loadtest/locustfile.py -u 10 -r 2 -t 25s --host http://127.0.0.1:8092 --csv /tmp/concierge-load-smoke --only-summary
          python loadtest/assert_smoke.py /tmp/concierge-load-smoke_stats.csv --require-staff-conversation
      - name: Report service and load failures
        if: failure()
        run: |
          pg_isready -h 127.0.0.1 -p 5432 -U concierge || true
          redis-cli -h 127.0.0.1 ping || true
          cat /tmp/concierge-api.log /tmp/concierge-mock-ai.log 2>/dev/null || true

  docker-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Generate one-run smoke credentials
        run: |
          {
            printf 'ADMIN_BOOTSTRAP_PASSWORD=%sA!\n' "$(openssl rand -hex 16)"
            printf 'CREDENTIAL_ENCRYPTION_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'METRICS_TOKEN=%s\n' "$(openssl rand -hex 32)"
          } >> "$GITHUB_ENV"
      - name: Build production image
        run: |
          CONCIERGE_BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          docker build \
            --build-arg CONCIERGE_VERSION=local \
            --build-arg "CONCIERGE_COMMIT=$GITHUB_SHA" \
            --build-arg "CONCIERGE_BUILD_DATE=$CONCIERGE_BUILD_DATE" \
            -t concierge-ai:ci .
      - name: Execute production environment validation in the image
        run: |
          docker run --rm --entrypoint python \
            -e APP_ENVIRONMENT=production \
            -e PROPERTY_ID=ci-property \
            -e DB_PATH=/state/concierge.db \
            -e UPLOAD_ROOT=/state/uploads \
            -e ADMIN_BOOTSTRAP_PASSWORD \
            -e CREDENTIAL_ENCRYPTION_SECRET \
            -e METRICS_TOKEN \
            -e ADMIN_COOKIE_SECURE=true \
            -e ALLOW_BODY_PROPERTY_SELECTION=false \
            -e ALLOW_DEMO_SETTINGS=false \
            -e APP_DEBUG=false \
            -e CANONICAL_HOSTS=ci-property.ci.example \
            -e PUBLIC_BASE_URL=https://ci-property.ci.example \
            -e ADMIN_ALLOWED_CIDRS=127.0.0.1/32 \
            -e FORWARDED_ALLOW_IPS=127.0.0.1 \
            -e ANTLABS_MODE=browser_handoff \
            -e ANTLABS_AUTH_URL=https://gateway.example.test/login/main.ant?c=proc \
            -e ANTLABS_AUTH_METHOD=POST \
            concierge-ai:ci -c 'from app.config import settings; assert settings.app_environment == "production"'
      - name: Scan production image for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: concierge-ai:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: concierge-ai:ci
          artifact-name: concierge-ai-production-sbom.spdx.json
          output-file: concierge-ai-production-sbom.spdx.json
          format: spdx-json
      - name: Upload image SBOM
        uses: actions/upload-artifact@v7
        with:
          name: concierge-ai-production-sbom
          path: concierge-ai-production-sbom.spdx.json
          if-no-files-found: error
      - name: Create persistent volume and start container
        run: |
          docker volume create concierge-ci-state
          docker run -d --name concierge-ci -p 8080:8080 --health-cmd="python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=4)\"" --health-interval=5s --health-retries=12 --health-start-period=5s -e APP_ENVIRONMENT=development -e ALLOW_DEMO_SETTINGS=true -e PROPERTY_ID=ci-property -e DB_PATH=/state/concierge.db -e UPLOAD_ROOT=/state/uploads -e ADMIN_BOOTSTRAP_PASSWORD -e CREDENTIAL_ENCRYPTION_SECRET -e ADMIN_COOKIE_SECURE=false -e ALLOW_BODY_PROPERTY_SELECTION=false -e ANTLABS_MODE=mock -e ENABLE_BACKGROUND_WORKERS=false -v concierge-ci-state:/state concierge-ai:ci
      - name: Verify non-root, healthy runtime, and write workflows
        run: |
          app_uid="$(docker exec concierge-ci id -u)"
          test "$app_uid" != "0"
          docker exec --user "$app_uid" concierge-ci sh -c 'test -w /state && test ! -w /app/app/main.py'
          for _ in $(seq 1 18); do
            test "$(docker inspect --format '{{.State.Health.Status}}' concierge-ci)" = healthy && break
            sleep 5
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' concierge-ci)" = healthy
          docker cp scripts/docker_smoke.py concierge-ci:/tmp/docker_smoke.py
          docker exec --user "$app_uid" -e CONCIERGE_SMOKE_URL=http://127.0.0.1:8080 -e ADMIN_BOOTSTRAP_PASSWORD="$ADMIN_BOOTSTRAP_PASSWORD" concierge-ci python /tmp/docker_smoke.py write
      - name: Recreate container and verify volume persistence
        run: |
          docker rm -f concierge-ci
          docker run -d --name concierge-ci -p 8080:8080 --health-cmd="python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=4)\"" --health-interval=5s --health-retries=12 --health-start-period=5s -e APP_ENVIRONMENT=development -e ALLOW_DEMO_SETTINGS=true -e PROPERTY_ID=ci-property -e DB_PATH=/state/concierge.db -e UPLOAD_ROOT=/state/uploads -e ADMIN_BOOTSTRAP_PASSWORD -e CREDENTIAL_ENCRYPTION_SECRET -e ADMIN_COOKIE_SECURE=false -e ALLOW_BODY_PROPERTY_SELECTION=false -e ANTLABS_MODE=mock -e ENABLE_BACKGROUND_WORKERS=false -v concierge-ci-state:/state concierge-ai:ci
          for _ in $(seq 1 18); do
            test "$(docker inspect --format '{{.State.Health.Status}}' concierge-ci)" = healthy && break
            sleep 5
          done
          docker cp scripts/docker_smoke.py concierge-ci:/tmp/docker_smoke.py
          app_uid="$(docker exec concierge-ci id -u)"
          docker exec --user "$app_uid" -e CONCIERGE_SMOKE_URL=http://127.0.0.1:8080 -e ADMIN_BOOTSTRAP_PASSWORD="$ADMIN_BOOTSTRAP_PASSWORD" concierge-ci python /tmp/docker_smoke.py verify
      - name: Container logs on failure
        if: failure()
        run: docker logs concierge-ci
      - name: Clean up runtime smoke
        if: always()
        run: |
          docker rm -f concierge-ci || true
          docker volume rm concierge-ci-state || true
  deployment-validation-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install service and shell validators
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Validate shared and Ubuntu installer shell
        run: |
          for script in deploy/install.sh deploy/linux/install.sh deploy/linux/platform.sh deploy/common/*.sh; do bash -n "$script"; done
          shellcheck --severity=warning -x deploy/install.sh deploy/linux/install.sh deploy/linux/platform.sh deploy/common/*.sh
      - name: Validate systemd service files
        run: |
          sudo install -d /etc/concierge /usr/local/bin /opt/concierge/current
          sudo touch /etc/concierge/concierge.env
          sudo install -m 0755 /bin/true /usr/local/bin/concierge
          sudo install -m 0644 deploy/linux/*.service deploy/linux/*.timer /etc/systemd/system/
          systemd-analyze verify concierge.service concierge-health.service concierge-health.timer concierge-backup.service concierge-backup.timer concierge-maintenance.service concierge-maintenance.timer
      - name: Validate Compose configuration
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backups"
          {
            printf 'ADMIN_BOOTSTRAP_PASSWORD=%sA!\n' "$(openssl rand -hex 32)"
            printf 'CREDENTIAL_ENCRYPTION_SECRET=%s\n' "$(openssl rand -hex 32)"
            printf 'METRICS_TOKEN=%s\n' "$(openssl rand -hex 32)"
            printf 'CANONICAL_HOSTS=concierge.ci.example\n'
            printf 'PUBLIC_BASE_URL=https://concierge.ci.example\n'
            printf 'ADMIN_ALLOWED_CIDRS=127.0.0.1/32\n'
            printf 'CONCIERGE_CONFIG_FILE=%s/concierge.env\n' "$RUNNER_TEMP"
            printf 'CONCIERGE_BACKUP_DIR=%s/backups\n' "$RUNNER_TEMP"
          } > "$RUNNER_TEMP/concierge.env"
          docker compose --env-file "$RUNNER_TEMP/concierge.env" -f docker-compose.yml config --quiet
      - name: Validate Nginx loopback and forwarding configuration
        run: >-
          docker run --rm
          -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:1.29-alpine nginx -t

  deployment-validation-macos:
    # PR gate: validate macOS artifacts without waiting for a scarce macOS runner.
    # Native macOS checks run in macos-native-validation.yml manually or on releases.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install --requirement requirements.txt
      - name: Validate shared and macOS installer shell
        run: |
          for script in deploy/install.sh deploy/macos/install.sh deploy/macos/platform.sh deploy/macos/run-proxy.sh deploy/macos/concierge-restart deploy/common/*.sh; do bash -n "$script"; done
          shellcheck --severity=warning -x deploy/install.sh deploy/macos/install.sh deploy/macos/platform.sh deploy/macos/run-proxy.sh deploy/macos/concierge-restart deploy/common/*.sh
      - name: Validate LaunchDaemon property lists
        run: |
          python - <<'PY'
          import plistlib
          from pathlib import Path
          for path in Path("deploy/macos").glob("*.plist"):
              with path.open("rb") as handle:
                  plistlib.load(handle)
              print(f"valid: {path}")
          PY
      - name: Check macOS support Python compiles
        run: python -m py_compile deploy/common/loopback_proxy.py deploy/common/ops.py
      - name: Generate one-run validation credentials
        run: |
          {
            printf 'ADMIN_BOOTSTRAP_PASSWORD=%sA!\n' "$(python -c 'import secrets; print(secrets.token_hex(24))')"
            printf 'CREDENTIAL_ENCRYPTION_SECRET=%s\n' "$(python -c 'import secrets; print(secrets.token_hex(32))')"
            printf 'METRICS_TOKEN=%s\n' "$(python -c 'import secrets; print(secrets.token_hex(32))')"
          } >> "$GITHUB_ENV"
      - name: Validate production settings
        run: |
          APP_ENVIRONMENT=production \
          PROPERTY_ID=ci-property \
          DB_PATH="$RUNNER_TEMP/concierge.sqlite" \
          UPLOAD_ROOT="$RUNNER_TEMP/concierge-uploads" \
          ADMIN_COOKIE_SECURE=true \
          ALLOW_BODY_PROPERTY_SELECTION=false \
          ALLOW_DEMO_SETTINGS=false \
          APP_DEBUG=false \
          CANONICAL_HOSTS=ci-property.ci.example \
          PUBLIC_BASE_URL=https://ci-property.ci.example \
          ADMIN_ALLOWED_CIDRS=127.0.0.1/32 \
          FORWARDED_ALLOW_IPS=127.0.0.1 \
          LOCAL_AI_ENABLED=false \
          ANTLABS_MODE=browser_handoff \
          ANTLABS_AUTH_URL='https://gateway.example.test/login/main.ant?c=proc' \
          ANTLABS_AUTH_METHOD=POST \
          python -c 'from app.config import settings; assert settings.app_environment == "production"'
