name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Compile application
        run: python -m compileall -q app

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  static-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies and Bandit
        run: pip install -r requirements-dev.txt
      - name: Run Python security analysis
        run: bandit -q -r app -x app/static --severity-level medium --confidence-level medium

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  browser-tests:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run functional and visual browser tests
        env:
          PLAYWRIGHT_SERVER_COMMAND: python -m uvicorn app.main:app --host 127.0.0.1 --port 8092
          PROPERTY_ID: lunara-mnl-001
          HOTEL_CONFIG_PATH: data/lunara.json
        run: npm run test:e2e

      - name: Upload browser report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Generate one-run smoke credentials
        run: |
          echo "ADMIN_BOOTSTRAP_PASSWORD=$(openssl rand -hex 16)A!" >> "$GITHUB_ENV"
          echo "CREDENTIAL_ENCRYPTION_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Build production image
        run: docker build -t concierge-ai:ci .
      - name: Scan production image for known vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: concierge-ai:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: concierge-ai:ci
          artifact-name: concierge-ai-production-sbom.spdx.json
          output-file: concierge-ai-production-sbom.spdx.json
          format: spdx-json
      - name: Upload image SBOM
        uses: actions/upload-artifact@v7
        with:
          name: concierge-ai-production-sbom
          path: concierge-ai-production-sbom.spdx.json
          if-no-files-found: error
      - name: Create persistent volume and start container
        run: |
          docker volume create concierge-ci-state
          docker run -d --name concierge-ci -p 8080:8080 --health-cmd="python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=4)\"" --health-interval=5s --health-retries=12 --health-start-period=5s -e APP_ENVIRONMENT=production -e PROPERTY_ID=hotel-a -e DB_PATH=/state/concierge.db -e UPLOAD_ROOT=/state/uploads -e ADMIN_BOOTSTRAP_PASSWORD -e CREDENTIAL_ENCRYPTION_SECRET -e ADMIN_COOKIE_SECURE=true -e ALLOW_BODY_PROPERTY_SELECTION=false -e ANTLABS_MODE=browser_handoff -e ANTLABS_AUTH_URL=https://gateway.invalid/auth -v concierge-ci-state:/state concierge-ai:ci
      - name: Verify non-root, healthy runtime, and write workflows
        run: |
          test "$(docker exec concierge-ci id -u)" != "0"
          for attempt in $(seq 1 18); do
            test "$(docker inspect --format '{{.State.Health.Status}}' concierge-ci)" = healthy && break
            sleep 5
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' concierge-ci)" = healthy
          python scripts/docker_smoke.py write
      - name: Recreate container and verify volume persistence
        run: |
          docker rm -f concierge-ci
          docker run -d --name concierge-ci -p 8080:8080 --health-cmd="python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=4)\"" --health-interval=5s --health-retries=12 --health-start-period=5s -e APP_ENVIRONMENT=production -e PROPERTY_ID=hotel-a -e DB_PATH=/state/concierge.db -e UPLOAD_ROOT=/state/uploads -e ADMIN_BOOTSTRAP_PASSWORD -e CREDENTIAL_ENCRYPTION_SECRET -e ADMIN_COOKIE_SECURE=true -e ALLOW_BODY_PROPERTY_SELECTION=false -e ANTLABS_MODE=browser_handoff -e ANTLABS_AUTH_URL=https://gateway.invalid/auth -v concierge-ci-state:/state concierge-ai:ci
          for attempt in $(seq 1 18); do
            test "$(docker inspect --format '{{.State.Health.Status}}' concierge-ci)" = healthy && break
            sleep 5
          done
          python scripts/docker_smoke.py verify
      - name: Container logs on failure
        if: failure()
        run: docker logs concierge-ci
      - name: Clean up runtime smoke
        if: always()
        run: |
          docker rm -f concierge-ci || true
          docker volume rm concierge-ci-state || true
