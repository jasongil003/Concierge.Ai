resolver 127.0.0.11 valid=10s ipv6=off;

# The published listener is host-loopback only. For local browser requests,
# Docker may report its bridge gateway rather than 127.0.0.1 as the peer.
map "$remote_addr|$http_x_forwarded_for|$host" $concierge_trusted_loopback_origin {
    default 0;
    ~^(127\.0\.0\.1|::1|172\.29\.0\.1)\|\|(localhost|127\.0\.0\.1|::1)$ 1;
}

map $concierge_trusted_loopback_origin $concierge_forwarded_for {
    1 127.0.0.1;
    0 $proxy_add_x_forwarded_for;
}

upstream concierge_api {
    zone concierge_api 64k;
    server concierge:8080 resolve;
    keepalive 64;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 30m;
    keepalive_timeout 65s;

    location / {
        proxy_pass http://concierge_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $concierge_forwarded_for;
        # The port is loopback-only. A trusted host TLS proxy must set this header;
        # configure FORWARDED_ALLOW_IPS to include that proxy's source address.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Concierge-Loopback-Origin $concierge_trusted_loopback_origin;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }
}
